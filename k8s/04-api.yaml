apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-data
  namespace: eclaim
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eclaim-api
  namespace: eclaim
spec:
  replicas: 1                    
  selector:
    matchLabels:
      app: eclaim-api
  template:
    metadata:
      labels:
        app: eclaim-api
    spec:
      initContainers:           
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z eclaim-mysql 3306; do echo waiting for mysql; sleep 2; done"]
      containers:
        - name: api
          image: eclaim-api:1.0
          imagePullPolicy: IfNotPresent 
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: eclaim-config
          env:                  
            - name: ConnectionStrings__DefaultConnection
              valueFrom: { secretKeyRef: { name: eclaim-secrets, key: ConnectionStrings__DefaultConnection } }
            - name: Jwt__Secret
              valueFrom: { secretKeyRef: { name: eclaim-secrets, key: Jwt__Secret } }
            - name: Email__BrevoApiKey
              valueFrom: { secretKeyRef: { name: eclaim-secrets, key: Email__BrevoApiKey } }
          readinessProbe:       
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:        
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
          volumeMounts:
            - name: uploads
              mountPath: /app/App_Data/uploads  
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: uploads-data
---
apiVersion: v1
kind: Service
metadata:
  name: eclaim-api               # nginx.conf proxies to http://eclaim-api:8080
  namespace: eclaim
spec:
  selector:
    app: eclaim-api
  ports:
    - port: 8080
      targetPort: 8080
