apiVersion: apps/v1
kind: Deployment
metadata:
  name: eclaim-frontend
  namespace: eclaim
spec:
  replicas: 2                   
  selector:
    matchLabels:
      app: eclaim-frontend
  template:
    metadata:
      labels:
        app: eclaim-frontend
    spec:
      containers:
        - name: frontend
          image: eclaim-frontend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: eclaim-frontend
  namespace: eclaim
spec:
  type: NodePort                
  selector:
    app: eclaim-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080           
