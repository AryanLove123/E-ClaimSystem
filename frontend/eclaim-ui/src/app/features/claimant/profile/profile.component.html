<div class="page" style="max-width:500px;">
  <h1>My Profile</h1>
  <p class="subtitle">Manage your account details.</p>

  @if(!loading()){
    <form class="card" [formGroup]="form" (ngSubmit)="save()">
    <div class="form-group">
      <label>Email</label>
      <input type="email" [value]="email" disabled />
      <small [style.color]="emailVerified ? '#166534' : '#b91c1c'">{{ emailVerified ? 'Verified' : 'Not verified' }}</small>
    </div>
    <div class="form-group">
      <label>Role</label>
      <input type="text" [value]="role" disabled />
    </div>
    <div class="form-group">
      <label>Full name</label>
      <input type="text" formControlName="fullName" />
    </div>
    <div class="form-group">
      <label>Phone number</label>
      <input type="tel" formControlName="phoneNumber" />
    </div>

    @if(saved()){
        <p class="success">Profile updated.</p>
    }
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Save Changes</button>
  </form>
  }
</div>
