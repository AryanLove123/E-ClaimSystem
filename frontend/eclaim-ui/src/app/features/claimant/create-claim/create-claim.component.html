<div class="container">
    <form class="card" [formGroup]="form" (ngSubmit)="submit()">
        <h1>New Claim</h1>
        <p class="subtitle">Fill in the details below. You can review and submit for processing after creation.</p>
        <div class="form-group">
            <label>Policy Number</label>
            <input type="text" class="form-control" formControlName="policyNumber">
        </div>

        <div class="form-group">
            <label>Claim Type</label>
            <select class="form-control" formControlName="claimType">
                <option value="" disabled selected>Select claim type</option>
                @for (type of claimTypes; track $index) {
                    <option [value]="type">{{ type }}</option>
                }
            </select>
        </div>

        <div class="form-group">
            <label>Incident Date</label>
            <input type="date" class="form-control" formControlName="incidentDate">
        </div>

        <div class="form-group">
            <label>Location</label>
            <input type="text" class="form-control" formControlName="location">
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea rows="4" class="form-control" formControlName="description"></textarea>
        </div>

        <div class="form-group">
            <label>Requested Amount (₹)</label>
            <input type="number" class="form-control" formControlName="requestedAmount" min="1">
        </div>

        @if(errorMessage()){
        <p class="error">{{errorMessage()}}</p>
        }

        <button type="submit" class="btn btn-primary" [disabled]="form.invalid || loading()">
            Create Claim
        </button>
    </form>

</div>
